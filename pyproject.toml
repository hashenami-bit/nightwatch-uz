[project]
name = "nightwatch-uz"
version = "0.1.0"
description = "Hourly weather-model collector and overnight-minimum prediction for ten monitored points in Uzbekistan"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

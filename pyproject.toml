[project]
name = "nightwatch-uz"
version = "0.1.0"
description = "Hourly weather-model collector and overnight-minimum prediction for ten monitored points in Uzbekistan"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
# Modelling and statistics (DECISIONS.md D015). A separate group, so the hourly collector
# (`uv sync --no-dev`) does not install it; the tests and the modelling workflow do.
analysis = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]
dev = ["pytest>=8", {include-group = "analysis"}]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]   # src too: macOS can hide the editable .pth file, which Python then skips
